<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrendamientos de campo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --surface-2:#E8ECE3; --ink:#18291F; --ink-2:#55665B; --line:#D3DACE;
  --primary:#1F4A33; --primary-ink:#FFFFFF;
  --trigo:#B9821A; --trigo-bg:#F6EBD2;
  --vencido:#A63A28; --vencido-bg:#F6DED8;
  --pagado:#2E6684; --pagado-bg:#DCE9F0;
  --ok:#3A7A4D; --ok-bg:#DDEEDD;
  --focus:#2E6684;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A15; --surface:#1A241E; --surface-2:#223029; --ink:#E7EEE7; --ink-2:#A2B3A7; --line:#33443A;
    --primary:#8CC7A0; --primary-ink:#0E1A13;
    --trigo:#E2B356; --trigo-bg:#3A2F17;
    --vencido:#F08B78; --vencido-bg:#43231D;
    --pagado:#86BEDB; --pagado-bg:#1C3340;
    --ok:#8CC79B; --ok-bg:#1F3726;
    --focus:#86BEDB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A15; --surface:#1A241E; --surface-2:#223029; --ink:#E7EEE7; --ink-2:#A2B3A7; --line:#33443A;
  --primary:#8CC7A0; --primary-ink:#0E1A13;
  --trigo:#E2B356; --trigo-bg:#3A2F17;
  --vencido:#F08B78; --vencido-bg:#43231D;
  --pagado:#86BEDB; --pagado-bg:#1C3340;
  --ok:#8CC79B; --ok-bg:#1F3726;
  --focus:#86BEDB;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pagado)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap}
.brand{font-weight:800;font-stretch:118%;font-size:18px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:600;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--vencido)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

main{padding:28px 0 60px}
h1{font-size:30px;font-stretch:112%;font-weight:750;letter-spacing:-.015em;margin:0 0 4px;line-height:1.15}
h2{font-size:18px;font-weight:700;margin:0 0 12px;font-stretch:105%}
.sub{color:var(--ink-2);margin:0 0 24px;max-width:70ch}
.muted{color:var(--ink-2)}
.notice{background:var(--trigo-bg);color:var(--ink);border-radius:10px;padding:12px 14px;margin:0 0 20px;font-size:14px}
.notice.err{background:var(--vencido-bg)}

/* Calendario de campaña: elemento principal */
.cal{display:grid;grid-template-columns:repeat(12,minmax(112px,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.cal-scroll{overflow-x:auto;margin:0 0 28px}
.mes{border-right:1px solid var(--line);padding:14px 10px 12px;min-height:178px;display:flex;flex-direction:column;cursor:pointer;background:none;border-top:0;border-bottom:0;border-left:0;text-align:left}
.mes:last-child{border-right:0}
.mes:hover{background:var(--surface-2)}
.mes .nm{font-stretch:125%;font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1;text-transform:capitalize}
.mes .yr{font-size:12px;color:var(--ink-2);margin-top:3px}
.mes .marks{display:flex;flex-direction:column;gap:4px;margin-top:auto;padding-top:14px}
.mark{height:8px;border-radius:2px;background:var(--trigo)}
.mark.vencido{background:var(--vencido)}
.mark.pagado{background:var(--pagado);opacity:.55}
.mark.fin{height:auto;background:none;border-left:3px solid var(--ink);padding-left:5px;font-size:11px;font-weight:700;line-height:1.2;border-radius:0}
.mes .tot{font-size:12px;color:var(--ink-2);margin-top:8px;min-height:1.2em}
.mes.hoy .nm{color:var(--primary)}
.sem{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:1.3;padding:2px 0 2px 6px;border-left:3px solid transparent;color:var(--ink-2)}
.sem.con{border-left-color:var(--trigo);color:var(--ink);font-weight:650}
.sem.con.vencido{border-left-color:var(--vencido);color:var(--vencido)}
.sem.con.pagado{border-left-color:var(--pagado);color:var(--ink-2);font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:-18px 0 26px}
.legend span::before{content:"";display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--trigo)}
.legend .l-v::before{background:var(--vencido)}
.legend .l-p::before{background:var(--pagado);opacity:.55}
.legend .l-f::before{background:none;border-left:3px solid var(--ink);border-radius:0;width:6px;height:12px}

.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:28px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 24px}
.stat b{display:block;font-size:24px;font-weight:750;font-stretch:110%}
.stat span{font-size:13px;color:var(--ink-2)}

.row{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .f{font-weight:700;font-stretch:90%;line-height:1.2}
.row .f small{display:block;font-weight:500;color:var(--ink-2)}
.row .t{min-width:0}
.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.vencido{background:var(--vencido-bg);color:var(--vencido)}
.chip.proximo{background:var(--trigo-bg);color:var(--trigo)}
.chip.pagado{background:var(--pagado-bg);color:var(--pagado)}
.chip.vigente{background:var(--ok-bg);color:var(--ok)}
.empty{color:var(--ink-2);padding:18px 0}
.chip.pg{background:none;border:1px solid var(--line);color:var(--ink);font-weight:600}
.chip.pg.efectivo{border-color:var(--ok);color:var(--ok)}
.chip.pg.nd{color:var(--ink-2)}
tr.grp td{background:var(--surface-2);font-size:13px}
.semline{display:flex;gap:8px;overflow-x:auto;margin:0 0 18px;padding-bottom:4px}
.wk{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;white-space:nowrap}
.wk b{font-size:15px}
.wk.actual{border-color:var(--primary)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.toolbar .grow{flex:1}
select,input[type=text],input[type=date],input[type=number],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--ink-2);font-size:13px;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}

.ctr{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:16px 18px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.ctr:first-child{border-top:0}
.ctr:hover{background:var(--surface-2)}
.ctr .nm{font-weight:700;font-size:16px}
.lnk{border:0;background:none;padding:0;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lnk:hover{text-decoration-color:currentColor}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--primary)}

.prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:0 0 24px}
.price{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.price b{display:block;font-size:20px;font-weight:750;margin-top:4px}
.price small{color:var(--ink-2);font-size:12px}
.sources{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}

dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,20,14,.45)}
#dlgConf{width:min(440px,calc(100vw - 24px))}
.btn.danger-fill{background:var(--vencido);border-color:var(--vencido);color:var(--bg)}
.btn.danger-fill:hover{filter:brightness(1.08);background:var(--vencido)}
.dlg-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-h h2{margin:0;flex:1}
.dlg-b{padding:18px 20px}
.dlg-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-2);padding:2px 6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}
.grid .full{grid-column:1/-1}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:600}
label.fld input,label.fld select,label.fld textarea{color:var(--ink);font-weight:400;font-size:15px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 16px}
legend{font-weight:700;padding:0 6px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--primary);background:var(--surface-2)}
.status{font-size:14px;color:var(--ink-2);margin-top:12px;min-height:1.4em}
.dudas{background:var(--trigo-bg);border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:14px}
.dudas ul{margin:6px 0 0;padding-left:18px}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;font-size:14px;margin:0 0 18px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}
@media (max-width:600px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:14px;margin-top:12px}
.calc .tot{font-weight:800;font-size:17px;border-top:1px solid var(--line);padding-top:6px}
.cuotas-edit td{padding:6px}
.cuotas-edit input{width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Arrendamientos</div>
    <nav class="tabs" aria-label="Secciones">
      <a href="#panel" data-v="panel">Panel</a>
      <a href="#vencimientos" data-v="vencimientos">Vencimientos</a>
      <a href="#contratos" data-v="contratos">Contratos</a>
      <a href="#precios" data-v="precios">Precios</a>
    </nav>
    <button class="btn primary" id="btnNuevo">Cargar contrato</button>
    <button class="btn" id="btnRespaldo" hidden>Respaldo</button>
    <button class="btn" id="btnSalir" hidden>Salir</button>
  </div>
</header>
<main><div class="wrap" id="view"><p class="muted">Cargando…</p></div></main>

<dialog id="dlg"></dialog>
<dialog id="dlgConf"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const semana = s => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 3); const y = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - y) / 864e5 - 3 + ((y.getDay() + 6) % 7)) / 7); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const fFecha = s => s ? new Date(s + "T12:00:00").toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const fDia = s => new Date(s + "T12:00:00").toLocaleDateString("es-AR", { day: "2-digit", month: "short" });
const ars = n => (n == null || isNaN(n)) ? "—" : new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(n);
const num = (n, d = 2) => (n == null || n === "" || isNaN(n)) ? "—" : new Intl.NumberFormat("es-AR", { maximumFractionDigits: d }).format(n);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const clean = o => JSON.parse(JSON.stringify(o));
const validDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2600); }

const PRODUCTOS = {
  soja:     { nombre: "Soja",     unidad: "$/t",  fuente: "Pizarra Cámara Arbitral Rosario (BCR)" },
  maiz:     { nombre: "Maíz",     unidad: "$/t",  fuente: "Pizarra Cámara Arbitral Rosario (BCR)" },
  trigo:    { nombre: "Trigo",    unidad: "$/t",  fuente: "Pizarra Cámara Arbitral Rosario (BCR)" },
  girasol:  { nombre: "Girasol",  unidad: "$/t",  fuente: "Pizarra Cámara Arbitral Rosario (BCR)" },
  sorgo:    { nombre: "Sorgo",    unidad: "$/t",  fuente: "Pizarra Cámara Arbitral Rosario (BCR)" },
  usd_bna:  { nombre: "Dólar BNA vendedor",  unidad: "$/USD", fuente: "Banco de la Nación Argentina" },
  usd_bna_compra: { nombre: "Dólar BNA comprador", unidad: "$/USD", fuente: "Banco de la Nación Argentina" },
  fut_soja_may27: { nombre: "Soja Matba Rofex mayo 2027", unidad: "USD/t", moneda: "USD", ref: true, fuente: "Matba Rofex, futuro Rosario mayo 2027" },
  fut_maiz_may27: { nombre: "Maíz Matba Rofex mayo 2027", unidad: "USD/t", moneda: "USD", ref: true, fuente: "Matba Rofex, futuro Rosario mayo 2027" },
};
const PRODUCTOS_LIQ = Object.fromEntries(Object.entries(PRODUCTOS).filter(([, v]) => !v.ref));
const fmtPrecio = (prod, v) => PRODUCTOS[prod]?.moneda === "USD" ? "USD " + num(+v, 2) : ars(+v);
const TIPOS = {
  granos:   { nombre: "Granos (quintales)", unidad: "qq",  convertir: p => p / 10 },
  hacienda: { nombre: "Hacienda (kg)",      unidad: "kg",  convertir: p => p },
  dolares:  { nombre: "Dólares",            unidad: "USD", convertir: p => p },
  pesos:    { nombre: "Pesos fijos",        unidad: "$",   convertir: null },
};
const FORMAS = { transferencia: "Transferencia bancaria", echeq: "Echeq", cheque: "Cheque", efectivo: "Efectivo", granos: "Entrega de granos", otro: "Otra" };
function cbuValido(s) {
  if (!/^\d{22}$/.test(s)) return false;
  const w1 = [7, 1, 3, 9, 7, 1, 3], w2 = [3, 9, 7, 1, 3, 9, 7, 1, 3, 9, 7, 1, 3];
  let t = 0; for (let i = 0; i < 7; i++) t += +s[i] * w1[i];
  if ((10 - t % 10) % 10 !== +s[7]) return false;
  t = 0; for (let i = 0; i < 13; i++) t += +s[8 + i] * w2[i];
  return (10 - t % 10) % 10 === +s[21];
}
const fCbu = s => String(s || "").replace(/(\d{8})(\d{14})/, "$1 $2");
function datosPago(c, q) {
  if (q && q.mutuo) return [["Forma de pago", "Efectivo (cuota en mutuo)"]];
  const out = [];
  if (c.formaPago) out.push(["Forma de pago", FORMAS[c.formaPago] || c.formaPago]);
  if (c.formaPago === "transferencia" || c.cbu) {
    if (c.cbu) out.push(["CBU", fCbu(c.cbu)]);
    if (c.alias) out.push(["Alias", c.alias]);
    if (c.titularCuenta) out.push(["Banco y titular", c.titularCuenta]);
  }
  if (c.notasPago) out.push(["Indicaciones", c.notasPago]);
  return out;
}
const GRUPOS = { transferencia: "Transferencia", cheque: "Cheque / Echeq", efectivo: "Efectivo", otro: "Otra forma", "": "Sin definir" };
const ORDEN_GRUPOS = ["transferencia", "cheque", "efectivo", "otro", ""];
function grupoPago(c, q) {
  if (q.mutuo) return "efectivo";
  const f = c.formaPago || "";
  if (f === "transferencia" || f === "efectivo") return f;
  if (f === "cheque" || f === "echeq") return "cheque";
  return f ? "otro" : "";
}
const chipPago = (c, q) => { const g = grupoPago(c, q); return `<span class="chip pg ${g || "nd"}">${esc(GRUPOS[g])}${q.mutuo ? " (mutuo)" : ""}</span>`; };
const METODOS = { promedio: "Promedio de los últimos días hábiles", dia_anterior: "Precio del día hábil anterior", fecha_pago: "Precio del día de pago" };
const FUENTES = [
  ["Pizarra Rosario (Cámara Arbitral, BCR)", "https://www.cac.bcr.com.ar/es/precios-de-pizarra"],
  ["Cotizaciones Banco Nación", "https://www.bna.com.ar/Personas"],
  ["Matba Rofex, futuros", "https://cem.matbarofex.com.ar/"],
];

/* ---------- estado y almacenamiento ---------- */
const S = { contratos: [], precios: [], loaded: { c: false, p: false }, mode: "local", sample: null, assets: null, downloads: null, filtro: { estado: "pendientes", contrato: "", mes: "", forma: "", agrupar: false }, error: "" };
const RUNTIME = {};
const use = n => Promise.resolve(RUNTIME[n] || null);
let sb = null;

const Store = {
  db: null,
  async init() {
    this.db = await use("db");
    if (this.db) { S.mode = "db"; this.subDb(); }
    else { S.mode = "local"; this.subLocal(); }
  },
  subDb() {
    const timer = setTimeout(() => { if (!S.loaded.c) { S.error = "Los datos tardan en llegar. Revisá la conexión y volvé a abrir la página."; render(); } }, 10000);
    const fail = e => { clearTimeout(timer); S.error = "No se pudieron leer los datos (" + (e && e.code || "error") + ")."; S.loaded.c = S.loaded.p = true; render(); };
    this.db.collection("contratos").onSnapshot(s => { clearTimeout(timer); S.error = ""; S.contratos = s.docs.map(d => ({ ...clean(d.data()), id: d.id })); S.loaded.c = true; render(); }, fail);
    this.db.collection("precios").onSnapshot(s => { S.precios = s.docs.map(d => ({ ...clean(d.data()), id: d.id })); S.loaded.p = true; render(); }, fail);
  },
  local(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem("arr_" + k) || "[]"); localStorage.setItem("arr_" + k, JSON.stringify(v)); } catch (e) { return v === undefined ? (this["_" + k] || []) : (this["_" + k] = v); } },
  subLocal() { S.contratos = this.local("contratos"); S.precios = this.local("precios"); S.loaded = { c: true, p: true }; render(); },
  async setContrato(c) {
    c = clean({ ...c, actualizado: new Date().toISOString() });
    if (this.db) return this.db.collection("contratos").doc(c.id).set(c);
    S.contratos = S.contratos.filter(x => x.id !== c.id).concat(c); this.local("contratos", S.contratos); render();
  },
  async delContrato(id) {
    if (this.db) return this.db.collection("contratos").doc(id).delete();
    S.contratos = S.contratos.filter(x => x.id !== id); this.local("contratos", S.contratos); render();
  },
  async setPrecio(p) {
    p = clean(p); p.id = p.producto + "_" + p.fecha;
    if (this.db) return this.db.collection("precios").doc(p.id).set(p);
    S.precios = S.precios.filter(x => x.id !== p.id).concat(p); this.local("precios", S.precios); render();
  },
  async delPrecio(id) {
    if (this.db) return this.db.collection("precios").doc(id).delete();
    S.precios = S.precios.filter(x => x.id !== id); this.local("precios", S.precios); render();
  },
};

/* ---------- lógica de negocio ---------- */
function estadoCuota(q) {
  if (q.estado === "pagado") return "pagado";
  const h = today();
  if (q.fecha < h) return "vencido";
  if (q.fecha <= addDays(h, 30)) return "proximo";
  return "pendiente";
}
const ESTADO_TXT = { pagado: "Pagado", vencido: "Vencido impago", proximo: "Próximo", pendiente: "Pendiente" };
function estadoContrato(c) {
  const h = today();
  if (!c.fin) return { k: "", t: "Sin fecha de fin" };
  if (c.fin < h) return { k: "vencido", t: "Vencido" };
  if (c.fin <= addDays(h, 180)) return { k: "proximo", t: "Vence en " + daysBetween(h, c.fin) + " días" };
  return { k: "vigente", t: "Vigente" };
}
function todasCuotas() {
  return S.contratos.flatMap(c => (c.cuotas || []).filter(q => validDate(q.fecha)).map(q => ({ c, q, e: estadoCuota(q) })))
    .sort((a, b) => a.q.fecha.localeCompare(b.q.fecha));
}
function ultimoPrecio(prod) {
  return S.precios.filter(p => p.producto === prod).sort((a, b) => b.fecha.localeCompare(a.fecha))[0] || null;
}
function precioPara(c, fechaRef) {
  if (c.tipoCanon === "pesos") return { precio: 1, usados: [], faltan: 0 };
  const incl = c.metodoPrecio === "fecha_pago";
  const lista = S.precios.filter(p => p.producto === c.producto && (incl ? p.fecha <= fechaRef : p.fecha < fechaRef))
    .sort((a, b) => b.fecha.localeCompare(a.fecha));
  const n = c.metodoPrecio === "promedio" ? Math.max(1, Math.round(+c.diasPromedio || 5)) : 1;
  const usados = lista.slice(0, n);
  if (!usados.length) return { precio: null, usados, faltan: n };
  return { precio: usados.reduce((s, p) => s + (+p.valor), 0) / usados.length, usados, faltan: n - usados.length };
}
function calcular(c, cantidad, precio) {
  const t = TIPOS[c.tipoCanon] || TIPOS.granos;
  let unit = c.tipoCanon === "pesos" ? 1 : (precio == null || precio === "" || isNaN(precio) ? null : t.convertir(+precio));
  if (unit == null) return null;
  const bruto = (+cantidad || 0) * unit;
  const desc = bruto * (+c.descuentoPct || 0) / 100;
  const iva = (bruto - desc) * (+c.ivaPct || 0) / 100;
  return { bruto, desc, iva, total: bruto - desc + iva };
}
function estimado(c, q) {
  if (q.estado === "pagado") return q.pago && q.pago.monto != null ? +q.pago.monto : (q.liquidacion ? q.liquidacion.total : null);
  if (q.liquidacion && q.liquidacion.total != null) return q.liquidacion.total;
  if (c.tipoCanon === "pesos") return calcular(c, neta(q), 1)?.total ?? null;
  const p = ultimoPrecio(c.producto);
  return p ? calcular(c, neta(q), p.valor)?.total ?? null : null;
}
const unidadDe = c => (TIPOS[c.tipoCanon] || TIPOS.granos).unidad;
const cant = (c, n) => num(n) + " " + unidadDe(c);
const neta = q => Math.max(0, (+q.cantidad || 0) - (+q.bonificacion || 0));
const tieneBonif = c => !!(c.bonificaciones && String(c.bonificaciones).trim()) || (c.cuotas || []).some(q => +q.bonificacion);
const porHaNum = (c, q) => +c.hectareas > 0 ? (+q.cantidad || 0) / +c.hectareas : null;
const porHa = (c, q) => { const v = porHaNum(c, q); return v == null ? "—" : num(v) + " " + unidadDe(c) + "/ha"; };

/* ---------- vistas ---------- */
const VISTAS = ["panel", "vencimientos", "contratos", "precios"];
const vistaActual = () => { const h = location.hash.slice(1); return VISTAS.includes(h) ? h : "panel"; };
function render() {
  const v = vistaActual();
  $$("nav.tabs a").forEach(a => { if (a.dataset.v === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const el = $("#view");
  if (!S.loaded.c && !S.error) { el.innerHTML = '<p class="muted">Cargando…</p>'; return; }
  let html = "";
  if (S.error) html += `<div class="notice err">${esc(S.error)}</div>`;
  if (S.mode === "local") html += `<div class="notice">Esta copia guarda los datos solo en este navegador. Abrila desde Claude para que queden guardados en la nube y puedas adjuntar archivos.</div>`;
  html += ({ panel: vPanel, vencimientos: vVencimientos, contratos: vContratos, precios: vPrecios })[v]();
  el.innerHTML = html;
  bindVista(v);
}
window.addEventListener("hashchange", render);

function filaCuota(x) {
  const m = estimado(x.c, x.q);
  return `<div class="row">
    <div class="f">${esc(fDia(x.q.fecha))}<small>${esc(x.q.fecha.slice(0, 4))}</small></div>
    <div class="t"><div><b>${esc(x.c.nombre || x.c.campo || "Contrato")}</b></div>
      <div class="muted">${esc(cant(x.c, x.q.cantidad))}${m != null ? " · " + (x.q.estado === "pagado" ? "pagado " : "aprox. ") + esc(ars(m)) : ""}</div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">${chipPago(x.c, x.q)}<span class="chip ${x.e}">${ESTADO_TXT[x.e]}</span>
      <button class="btn small" data-liq="${esc(x.c.id)}|${esc(x.q.id)}">${x.e === "pagado" ? "Ver" : "Liquidar"}</button></div>
  </div>`;
}

function semanasMes(d, qs) {
  const y = d.getFullYear(), m = d.getMonth(), last = new Date(y, m + 1, 0).getDate();
  const weeks = [];
  for (let day = 1; day <= last; day++) { const w = semana(iso(new Date(y, m, day))); if (!weeks.includes(w)) weeks.push(w); }
  return weeks.map(w => {
    const xs = qs.filter(x => semana(x.q.fecha) === w);
    const tot = xs.reduce((s, x) => s + (estimado(x.c, x.q) || 0), 0);
    const cls = !xs.length ? "" : xs.some(x => x.e === "vencido") ? "con vencido" : xs.every(x => x.e === "pagado") ? "con pagado" : "con";
    const tip = xs.map(x => (x.c.nombre || x.c.campo || "") + ", " + fDia(x.q.fecha) + ": " + ars(estimado(x.c, x.q))).join("\n");
    return `<span class="sem ${cls}" title="${esc(tip)}"><span>S${w}</span><span>${xs.length ? (tot ? esc(corto(tot)) : xs.length + (xs.length > 1 ? " cuotas" : " cuota")) : "—"}</span></span>`;
  }).join("");
}
const corto = v => v >= 1e6 ? "$ " + num(v / 1e6, 1) + " M" : v >= 1e3 ? "$ " + num(v / 1e3, 0) + " mil" : ars(v);

function lunes(s) { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); }

  xs.forEach(x => { const k = lunes(x.q.fecha); porSemana[k] = (porSemana[k] || 0) + (estimado(x.c, x.q) || 0); });

    ${xs.length ? `<div class="table-wrap"><table>

function haAnual(c, total) {
  if (!(+c.hectareas > 0)) return '<span class="muted" title="Faltan las hectáreas del contrato">Sí, sin ha</span>';
  const anios = c.inicio && c.fin ? Math.max(1, Math.round(daysBetween(c.inicio, c.fin) / 365)) : 1;
  return esc(num(total / +c.hectareas / anios) + " " + unidadDe(c) + "/ha");
}
function canonHa(c) {
  const v = +c.cantidadPorHa || (+c.cantidadAnual && +c.hectareas ? c.cantidadAnual / c.hectareas : 0);
  return v ? num(v) + " " + unidadDe(c) + "/ha" : "—";
}
function resumenCanon(c) {
  const t = TIPOS[c.tipoCanon] || TIPOS.granos;

}

const FUENTES_MAN = {
  bcr:   { nombre: "Bolsa de Comercio de Rosario (pizarra)", prods: ["soja", "maiz", "trigo", "girasol", "sorgo"], lbl: "Grano" },
  rofex: { nombre: "Matba Rofex (mayo 2027)", prods: ["fut_soja_may27", "fut_maiz_may27"], lbl: "Grano" },
  bna:   { nombre: "Banco Nación (tipo de cambio)", prods: ["usd_bna", "usd_bna_compra"], lbl: "Tipo" },
};
function tcPara(fecha, tipo) {
  return S.precios.filter(p => p.producto === tipo && p.fecha <= fecha).sort((a, b) => b.fecha.localeCompare(a.fecha))[0] || null;
}
function detalleTc(p, pre, post) {
  if (p.valorUsd != null && p.tc) return pre + esc("USD " + num(p.valorUsd, 2) + " × TC " + ars(p.tc) + " (" + fDia(p.tcFecha) + ")") + post;
  if (p.valorArs != null && p.tc) return pre + esc("≈ " + ars(p.valorArs) + "/t con TC " + ars(p.tc) + " (" + fDia(p.tcFecha) + ")") + post;
  return "";
}
function bindPrecioManual() {
  const fu = $("#pFuente"), pr = $("#pProd"), mo = $("#pMoneda"), va = $("#pValor"), fe = $("#pFecha"), tc = $("#pTc"), info = $("#pTcInfo");
  const usd = () => fu.value === "rofex" || (fu.value === "bcr" && mo.value === "USD");
  const actualizar = () => {
    const F = FUENTES_MAN[fu.value];
    $("#pMonedaWrap").hidden = fu.value !== "bcr";
    $("#pTcWrap").hidden = !usd();
    $("#pValorLbl").textContent = fu.value === "bna" ? "Valor ($ por USD)" : usd() ? "Valor (USD por tonelada)" : "Valor ($ por tonelada)";
    va.placeholder = fu.value === "bna" ? "Ej. 1450" : usd() ? "Ej. 315.50" : "Ej. 535000";
    if (!usd()) { info.textContent = ""; return; }
    const t = validDate(fe.value) ? tcPara(fe.value, tc.value) : null;
    const v = parseFloat(va.value);
    if (!t) { info.innerHTML = `No hay dólar ${esc(PRODUCTOS[tc.value].nombre.replace("Dólar ", ""))} cargado para esa fecha o antes. Cargalo primero eligiendo la fuente Banco Nación.`; return; }
    info.textContent = "TC " + PRODUCTOS[tc.value].nombre.replace("Dólar ", "") + " del " + fFecha(t.fecha) + ": " + ars(t.valor) + (t.fecha !== fe.value ? " (último cargado antes de esa fecha)" : "") + (v > 0 ? " · equivale a " + ars(v * t.valor) + " por tonelada" : "");
  };
  const llenarProds = () => { const F = FUENTES_MAN[fu.value]; $("#pProdLbl").textContent = F.lbl; pr.innerHTML = F.prods.map(p => `<option value="${p}">${esc(fu.value === "bna" ? (p === "usd_bna" ? "Vendedor" : "Comprador") : PRODUCTOS[p].nombre.replace(" Matba Rofex mayo 2027", ""))}</option>`).join(""); actualizar(); };
  fu.onchange = () => { llenarProds(); guardarSel(); }; [mo, tc, fe].forEach(el => el.onchange = () => { actualizar(); guardarSel(); }); va.oninput = actualizar; pr.onchange = guardarSel;
  const sel = S.pm || {};
  if (sel.fuente) fu.value = sel.fuente;
  if (sel.moneda) mo.value = sel.moneda;
  if (sel.tc) tc.value = sel.tc;
  if (sel.fecha) fe.value = sel.fecha;
  llenarProds();
  if (sel.prod && [...pr.options].some(o => o.value === sel.prod)) pr.value = sel.prod;
  if (sel.valor) va.value = sel.valor;
  actualizar();
  function guardarSel() { S.pm = { fuente: fu.value, moneda: mo.value, tc: tc.value, fecha: fe.value, prod: pr.value, valor: va.value }; }
  va.addEventListener("input", guardarSel);
  $("#btnPrecio").onclick = async () => {
    const valor = parseFloat(va.value), fecha = fe.value, producto = pr.value, F = FUENTES_MAN[fu.value];
    if (!(valor > 0) || !validDate(fecha)) { toast("Completá fecha y valor"); return; }
    let doc = { producto, fecha, valor, fuente: PRODUCTOS[producto].fuente + " (carga manual)" };
    if (usd()) {
      const t = tcPara(fecha, tc.value);
      if (!t) { toast("Primero cargá el dólar Banco Nación de esa fecha"); return; }
      const base = { tc: +t.valor, tcTipo: tc.value, tcFecha: t.fecha };
      if (fu.value === "bcr") doc = { ...doc, ...base, valor: valor * t.valor, valorUsd: valor, fuente: PRODUCTOS[producto].fuente + " en USD, convertido con " + PRODUCTOS[tc.value].nombre + " (carga manual)" };
      else doc = { ...doc, ...base, valorArs: valor * t.valor };
    }
    try { await Store.setPrecio(doc); toast("Precio guardado"); va.value = ""; guardarSel(); actualizar(); }
    catch (e) { toast("No se pudo guardar: " + (e.code || "error")); }
  };
}

      $$("[data-close]", $("#lInfo")).forEach(a => a.onclick = () => dlg.close());
    } else if (!esPesos) { usados = []; $("#lInfo").textContent = "Precio ingresado a mano."; }
    const r = calcular(c, neta(q), precio);
    $("#lCalc").innerHTML = r ? `<span>Bruto (${esc(cant(c, neta(q)))}${!esPesos ? " × " + esc(ars(t.convertir(precio))) + "/" + esc(t.unidad) : ""})</span><span>${esc(ars(r.bruto))}</span>
      ${+c.descuentoPct ? `<span>Descuento pactado ${esc(num(c.descuentoPct))}%</span><span>−${esc(ars(r.desc))}</span>` : ""}
      ${+c.ivaPct ? `<span>IVA ${esc(num(c.ivaPct))}%</span><span>${esc(ars(r.iva))}</span>` : ""}
      <span class="tot">Total a pagar</span><span class="tot">${esc(ars(r.total))}</span>` : "";
    if (r && !$("#pMonto").dataset.touched && q.estado !== "pagado") $("#pMonto").value = r.total.toFixed(2);
    return { precio, r };
  };
  if (!esPesos) {
    if (q.liquidacion?.precio != null) { $("#lPrecio").value = q.liquidacion.precio; usados = q.liquidacion.preciosUsados || []; $("#lInfo").textContent = "Liquidación guardada el " + fFecha(q.liquidacion.fechaCalc) + ". Cambiá la fecha de referencia para recalcular."; recalcular(false); }
    else recalcular(true);
    $("#lRef").onchange = () => recalcular(true);
    $("#lPrecio").oninput = () => recalcular(false);
  } else recalcular(false);
  $("#pMonto").oninput = e => e.target.dataset.touched = "1";
  const bPdf = $("#lPdf");
  if (bPdf) bPdf.onclick = async () => {
    const { precio, r } = recalcular(false);
    if (!r) { toast("Falta el precio para liquidar"); return; }
    bPdf.disabled = true; bPdf.textContent = "Generando…";
    try {
      const blob = await pdfLiquidacion(c, q, {
        precio: esPesos ? null : precio, r, usados, fechaRef: esPesos ? null : $("#lRef").value,
        facturaNum: $("#fNum").value.trim(), pagado: $("#pPag").checked,
        pago: { fecha: $("#pFec").value, monto: parseFloat($("#pMonto").value) || r.total, nota: $("#pNota").value.trim() },
      });
      const slug = String(c.nombre || c.campo || "contrato").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase().slice(0, 40);
      await S.downloads.save({ filename: `liquidacion-${slug}-${q.fecha}.pdf`, data: blob });
    } catch (e) {
      if (!e || e.code !== "declined") toast("No se pudo generar el PDF" + (e && (e.code || e.message) ? ": " + (e.code || e.message) : ""));
    } finally { bPdf.disabled = false; bPdf.textContent = "Descargar PDF"; }
  };

  $("#lGuardar").onclick = async () => {
    const btn = $("#lGuardar"); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      const { precio, r } = recalcular(false);
      const nq = { ...q };
      if (r) nq.liquidacion = { fechaCalc: today(), fechaRef: esPesos ? null : $("#lRef").value, precio: esPesos ? null : precio, preciosUsados: usados.map(p => ({ fecha: p.fecha, valor: p.valor })), bruto: r.bruto, descuento: r.desc, iva: r.iva, total: r.total };
      const numF = $("#fNum").value.trim();
      const file = $("#fArch")?.files?.[0];
      let fac = q.factura ? { ...q.factura } : null;
      if (file) {
        const up = await S.assets.upload(file, file.type ? undefined : { type: "application/pdf" });
        fac = { ...(fac || {}), assetId: up.id, nombre: file.name };
      }
      if (numF || fac) fac = { ...(fac || {}), numero: numF };
      if (fac) nq.factura = fac;
      if ($("#pPag").checked) { nq.estado = "pagado"; nq.pago = { fecha: $("#pFec").value, monto: parseFloat($("#pMonto").value) || (r ? r.total : null), nota: $("#pNota").value.trim() }; }
      else { nq.estado = "pendiente"; delete nq.pago; }
      const nc = { ...c, cuotas: c.cuotas.map(x => x.id === q.id ? nq : x) };
      await Store.setContrato(nc);
      dlg.close(); toast(nq.estado === "pagado" ? "Cuota marcada como pagada" : "Liquidación guardada");
    } catch (e) { btn.disabled = false; btn.textContent = "Guardar"; toast("No se pudo guardar: " + (e.code || e.message || "error")); }
  };
}

/* ---------- PDF de liquidación ---------- */
async function pdfLiquidacion(c, q, d) {
  await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
  const T = s => String(s ?? "").replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014\u2212]/g, "-").replace(/\u2026/g, "...").replace(/[\u202F\u2007]/g, " ").replace(/[^\x00-\xFF]/g, "");
  const W = 210, M = 20; let y = 22;
  const salto = h => { if (y + h > 280) { doc.addPage(); y = 22; } };
  const seccion = t => { y += 3; salto(14); doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.text(T(t), M, y); y += 2; doc.setDrawColor(210); doc.line(M, y, W - M, y); y += 5; doc.setFont("helvetica", "normal"); doc.setFontSize(10); };
  const kv = (k, v) => { if (v == null || v === "") return; const lines = doc.splitTextToSize(T(v), W - 2 * M - 55); salto(lines.length * 5 + 1); doc.setTextColor(95); doc.text(T(k), M, y); doc.setTextColor(0); doc.text(lines, M + 55, y); y += lines.length * 5 + 1; };
  const monto = (k, v, bold) => { salto(7); doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(bold ? 12 : 10); doc.text(T(k), M, y); doc.text(T(v), W - M, y, { align: "right" }); y += bold ? 7 : 6; doc.setFont("helvetica", "normal"); doc.setFontSize(10); };
  const t = TIPOS[c.tipoCanon] || TIPOS.granos, prod = PRODUCTOS[c.producto];

  doc.setFont("helvetica", "bold"); doc.setFontSize(17); doc.text(T("Liquidación de canon de arrendamiento"), M, y); y += 7;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(95);
  doc.text(T("Emitida el " + fFecha(today())), M, y); doc.setTextColor(0); y += 6;

  // Resumen
  const bw = W - 2 * M, cw = bw / 4;
  doc.setFillColor(240, 243, 238); doc.rect(M, y, bw, 34, "F");
  const celda = (k, v, col, fila, span = 1) => {
    const x = M + 4 + col * cw, yy = y + 8 + fila * 15;
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(95); doc.text(T(k), x, yy);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(0);
    let s = T(v); const max = cw * span - 6; while (s.length > 3 && doc.getTextWidth(s) > max) s = s.slice(0, -2);
    if (s !== T(v)) s = s.slice(0, -1) + "...";
    doc.text(s, x, yy + 6);
  };
  celda("Vencimiento", fFecha(q.fecha), 0, 0);
  celda("Hectáreas", c.hectareas ? num(c.hectareas, 1) + " ha" : "-", 1, 0);
  celda("Por hectárea", porHa(c, q).replace("—", "-"), 2, 0);
  celda("Importe a pagar", ars(d.r.total), 3, 0);
  celda("Cobra (arrendador)", c.arrendador || "-", 0, 1, 2);
  celda("Paga (arrendatario)", c.arrendatario || "-", 2, 1, 2);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  y += 38;

  seccion("Contrato");
  kv("Contrato", c.nombre || c.campo);
  kv("Arrendador", [c.arrendador, c.arrendadorCuit ? "CUIT " + c.arrendadorCuit : ""].filter(Boolean).join(", "));
  kv("Arrendatario", [c.arrendatario, c.arrendatarioCuit ? "CUIT " + c.arrendatarioCuit : ""].filter(Boolean).join(", "));
  kv("Campo", [c.campo, c.ubicacion, c.hectareas ? num(c.hectareas, 1) + " ha" : ""].filter(Boolean).join(", "));
  if (c.inicio || c.fin) kv("Plazo", fFecha(c.inicio) + " al " + fFecha(c.fin));

  seccion("Cuota");
  kv("Concepto", q.descripcion || "Cuota de canon");
  kv("Vencimiento", fFecha(q.fecha) + " (semana " + semana(q.fecha) + ")");
  kv("Cantidad", cant(c, q.cantidad) + (prod && c.tipoCanon !== "pesos" ? " de " + prod.nombre.toLowerCase() : ""));
  if (+q.bonificacion) kv("Bonificación", "- " + cant(c, q.bonificacion) + " (se liquidan " + cant(c, neta(q)) + ")" + (c.bonificaciones ? "\n" + c.bonificaciones : ""));
  if (q.mutuo) kv("Mutuo", "Cuota documentada en mutuo" + (c.mutuo ? "\n" + c.mutuo : ""));
  if (porHaNum(c, q) != null) kv("Por hectárea", porHa(c, q) + " sobre " + num(c.hectareas, 1) + " ha");

  if (c.tipoCanon !== "pesos") {
    seccion("Precio");
    kv("Referencia", prod ? prod.nombre + " (" + prod.fuente + ")" : "");
    kv("Método", (METODOS[c.metodoPrecio] || "") + (c.metodoPrecio === "promedio" ? " (" + (c.diasPromedio || 5) + " días)" : ""));
    kv("Cláusula", c.fuentePrecio);
    kv("Fecha de referencia", d.fechaRef ? fFecha(d.fechaRef) : "");
    if (d.usados && d.usados.length) kv("Precios utilizados", d.usados.map(p => fFecha(p.fecha) + ": " + ars(p.valor)).join("\n"));
    else kv("Precios utilizados", "Precio ingresado manualmente");
    kv("Precio aplicado", ars(d.precio) + " " + (prod ? prod.unidad : "") + (c.tipoCanon === "granos" ? " (" + ars(t.convertir(d.precio)) + " por qq)" : ""));
  }

  seccion("Liquidación");
  monto("Importe bruto" + (c.tipoCanon !== "pesos" ? " (" + cant(c, neta(q)) + " x " + ars(t.convertir(d.precio)) + ")" : ""), ars(d.r.bruto));
  if (+c.descuentoPct) monto("Descuento pactado " + num(c.descuentoPct) + "%", "- " + ars(d.r.desc));
  if (+c.ivaPct) monto("IVA " + num(c.ivaPct) + "%", ars(d.r.iva));
  salto(4); doc.setDrawColor(120); doc.line(M, y - 3, W - M, y - 3); y += 1;
  monto("Total a pagar", ars(d.r.total), true);

  const dp = datosPago(c, q);
  if (dp.length) { seccion("Datos para el pago"); dp.forEach(([k, v]) => kv(k, v)); }

  if (d.facturaNum || d.pagado) {
    seccion("Factura y pago");
    kv("Factura", d.facturaNum);
    if (d.pagado) { kv("Estado", "Pagado"); kv("Fecha de pago", fFecha(d.pago.fecha)); kv("Monto pagado", ars(d.pago.monto)); kv("Nota", d.pago.nota); }
  }

  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(130); doc.text(T("Liquidación calculada según las condiciones del contrato y los precios indicados. Página " + i + " de " + n), M, 289); }
  return doc.output("blob");
}

/* ---------- carga de PDF ---------- */
function cargarScript(src) {
  return new Promise((res, rej) => { if ($$(`script[src="${src}"]`).length) return res(); const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar el lector de PDF")); document.head.appendChild(s); });
}
async function pdfjs() {
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  await cargarScript(base + "pdf.worker.min.js"); // queda en el hilo principal (sin worker externo)
  await cargarScript(base + "pdf.min.js");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
  return window.pdfjsLib;
}
async function leerPdf(file, status) {
  const lib = await pdfjs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  let texto = "";
  for (let i = 1; i <= doc.numPages; i++) {
    status("Leyendo página " + i + " de " + doc.numPages + "…");
    const pg = await doc.getPage(i);
    const tc = await pg.getTextContent();
    texto += "\n\n--- Página " + i + " ---\n" + tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("");
  }
  return { doc, texto: texto.trim(), paginas: doc.numPages };
}
async function paginasComoImagen(doc, max, status) {
  const blobs = [];
  for (let i = 1; i <= Math.min(doc.numPages, max); i++) {
    status("Preparando imagen de la página " + i + "…");
    const pg = await doc.getPage(i);
    const vp = pg.getViewport({ scale: 1.6 });
    const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
    await pg.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    blobs.push(await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82)));
  }
  return blobs;
}

const PROMPT_CONTRATO = hoy => `Sos un asistente que lee contratos de arrendamiento rural de Argentina. Hoy es ${hoy}.
Leé el contrato y respondé SOLO un objeto JSON con esta forma exacta:
{
 "nombre": "nombre corto para identificarlo, ej. nombre del campo y localidad",
 "arrendador": string|null, "arrendadorCuit": string|null,
 "arrendatario": string|null, "arrendatarioCuit": string|null,
 "campo": string|null, "ubicacion": "partido o localidad y provincia"|null, "hectareas": number|null,
 "inicio": "YYYY-MM-DD"|null, "fin": "YYYY-MM-DD"|null,
 "tipoCanon": "granos"|"hacienda"|"dolares"|"pesos",
 "producto": "soja"|"maiz"|"trigo"|"girasol"|"sorgo"|"usd_bna"|"usd_bna_compra"|null,
 "cantidadPorHa": number|null,
 "cantidadAnual": number|null,
 "fuentePrecio": "cita breve de la cláusula que fija el precio"|null,
 "metodoPrecio": "promedio"|"dia_anterior"|"fecha_pago",
 "diasPromedio": number|null,
 "descuentoPct": number,
 "ivaPct": number,
 "cuotas": [{"fecha": "YYYY-MM-DD", "cantidad": number, "descripcion": "ej. 1ª cuota campaña 2025/26", "bonificacion": number, "mutuo": boolean}],
 "formaPago": "transferencia"|"echeq"|"cheque"|"efectivo"|"granos"|"otro"|null,
 "cbu": "22 dígitos sin espacios"|null, "alias": string|null, "titularCuenta": "banco y titular de la cuenta"|null,
 "bonificaciones": "descripción de las bonificaciones o quitas pactadas sobre el canon (por rinde, pago anticipado, sequía, etc.)"|null,
 "mutuo": "descripción de las cuotas que se documentan o financian mediante mutuo (monto, tasa, plazo)"|null,
 "clausulasClave": "resumen breve de renovación, preaviso, mora e intereses, rescisión, destino del campo, seguros y otras obligaciones",
 "dudas": ["datos ambiguos, faltantes o que conviene revisar"]
}
Reglas:
- Unidades: para granos las cantidades van en quintales (qq = 100 kg; si el contrato habla en kg o toneladas, convertí). Para hacienda, kg de novillo. Para dólares, USD. Para pesos, pesos.
- Si el precio se toma de la pizarra de la Cámara Arbitral de Rosario, elegí el grano que corresponda. "dolares" con tipo de cambio Banco Nación vendedor es usd_bna; comprador es usd_bna_compra. Si el contrato usa otra fuente (por ejemplo Cañuelas o BCRA A 3500), usá null en producto y anotalo en "dudas".
- Listá TODAS las cuotas de todo el plazo del contrato, una por fecha. Si una cuota se pacta como porcentaje del canon anual, convertila a cantidad. Si el contrato dice "por adelantado" o da un día y mes sin año, calculá las fechas concretas para cada campaña dentro del plazo.
- descuentoPct: gastos de comercialización, flete u otros descuentos pactados sobre el precio; 0 si no hay. ivaPct: 0 salvo que el contrato diga que se agrega IVA.
- bonificacion de cada cuota: cantidad (en la misma unidad que la cuota) que se descuenta de esa cuota por una bonificación pactada de forma fija; 0 si no hay o si depende de una condición incierta (en ese caso describila en "bonificaciones" y en "dudas").
- mutuo de cada cuota: true si esa cuota se instrumenta, financia o garantiza mediante un contrato de mutuo; si no, false.
- No inventes datos: si algo no figura, usá null y anotalo en "dudas".`;

function nuevoVacio() { return { id: uid(), creado: new Date().toISOString(), tipoCanon: "granos", producto: "soja", metodoPrecio: "promedio", diasPromedio: 5, descuentoPct: 0, ivaPct: 0, cuotas: [] }; }

async function procesar(file) {
  const st = $("#nStatus"); const status = t => { if (st) st.textContent = t; };

  $("#drop").style.pointerEvents = "none";

    status("Abriendo el PDF…");
    const { doc, texto } = await leerPdf(file, status);
    let datos;

      status("Claude está leyendo el contrato. Puede tardar hasta un minuto…");
      datos = await S.sample.json(PROMPT_CONTRATO(today()) + "\n\nCONTRATO:\n" + texto.slice(0, 180000), { modelTier: "default", cache: false });
    } else {

      const imgs = await paginasComoImagen(doc, Math.min(lim.images.maxCount || 6, 10), status);

    }

    const msg = { not_granted: "No se habilitó el uso de Claude en esta página.", rate_limited: "Demasiadas consultas; probá en un rato.", invalid_json: "La respuesta no se pudo interpretar. Probá de nuevo.", refused: "Claude no pudo procesar este documento." }[e && e.code] || ("No se pudo leer el PDF" + (e && e.message ? ": " + e.message : "."));

}

const BUCKET = "archivos";
const errSb = e => ({ code: e && (e.code || e.status) ? String(e.code || e.status) : "error", message: e && e.message });

async function traerTodo(tabla) {
  const filas = [];
  for (let desde = 0; ; desde += 1000) {
    const { data, error } = await sb.from(tabla).select("id,data").range(desde, desde + 999);
    if (error) throw errSb(error);
    filas.push(...data);
    if (data.length < 1000) return filas;
  }
}

function crearDb() {
  const recargas = {};
  return {
    collection(nombre) {
      return {
        onSnapshot(cb, err) {
          let t = null;
          const cargar = async () => {
            try { const filas = await traerTodo(nombre); cb({ docs: filas.map(r => ({ id: r.id, data: () => r.data })) }); }
            catch (e) { err && err(e); }
          };
          recargas[nombre] = cargar;
          cargar();
          sb.channel("cambios_" + nombre)
            .on("postgres_changes", { event: "*", schema: "public", table: nombre }, () => { clearTimeout(t); t = setTimeout(cargar, 400); })
            .subscribe();
          return () => {};
        },
        doc(id) {
          return {
            async set(obj) {
              const { error } = await sb.from(nombre).upsert({ id, data: obj, updated_at: new Date().toISOString() });
              if (error) throw errSb(error);
              recargas[nombre] && recargas[nombre]();
            },
            async delete() {
              const { error } = await sb.from(nombre).delete().eq("id", id);
              if (error) throw errSb(error);
              recargas[nombre] && recargas[nombre]();
            },
          };
        },
      };
    },
  };
}

const archivosApi = {
  async upload(file, opts) {
    const limpio = (file.name || "archivo").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9._-]+/g, "-").slice(-80);
    const ruta = new Date().toISOString().slice(0, 10) + "-" + uid() + "-" + limpio;
    const { error } = await sb.storage.from(BUCKET).upload(ruta, file, { contentType: (opts && opts.type) || file.type || "application/octet-stream", upsert: false });
    if (error) throw errSb(error);
    return { id: ruta };
  },
};

const descargasApi = {
  async save({ filename, data }) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.csv$/i.test(filename) ? "text/csv;charset=utf-8" : "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  },
};

const aBase64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("No se pudo leer la imagen")); r.readAsDataURL(blob); });

async function leerStream(resp) {
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = "", texto = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const linea = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!linea.startsWith("data:")) continue;
      let ev; try { ev = JSON.parse(linea.slice(5)); } catch { continue; }
      if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") texto += ev.delta.text;
      else if (ev.type === "error") throw { code: ev.error && ev.error.type === "overloaded_error" ? "rate_limited" : "unavailable", message: ev.error && ev.error.message };
    }
  }
  return texto;
}
function extraerJson(t) {
  t = String(t || "").replace(/```(?:json)?/gi, "").trim();
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("]"), t.lastIndexOf("}"));
  if (a < 0 || b < a) throw { code: "invalid_json" };
  try { return JSON.parse(t.slice(a, b + 1)); } catch { throw { code: "invalid_json" }; }
}

const claudeApi = {
  async limits() { return { images: { maxCount: 10 } }; },
  async json(prompt, opts = {}) {
    const images = await Promise.all((opts.images || []).map(aBase64));
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw { code: "not_granted" };
    const resp = await fetch("/api/claude", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + session.access_token },
      body: JSON.stringify({ prompt: prompt + "\n\nRespondé únicamente con JSON válido, sin texto antes ni después y sin bloques de código.", images, rapido: opts.modelTier === "quick" }),
    });
    if (!resp.ok) {
      let m = ""; try { m = (await resp.json()).error; } catch {}
      throw { code: resp.status === 401 ? "not_granted" : resp.status === 429 || resp.status === 529 ? "rate_limited" : "unavailable", message: m };
    }
    return extraerJson(await leerStream(resp));
  },
};

  $("#rArch").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const st = $("#rStatus");
    let d; try { d = JSON.parse(await f.text()); } catch { st.textContent = "El archivo no es un respaldo válido."; return; }
    const cs = Array.isArray(d.contratos) ? d.contratos.filter(c => c && c.id) : [];
    const ps = (Array.isArray(d.precios) ? d.precios : []).filter(p => p && p.producto && validDate(p.fecha)).map(p => ({ ...p, id: p.producto + "_" + p.fecha }));
    if (!(await confirmar(`Se van a cargar ${cs.length} contratos y ${ps.length} precios. ¿Continuar?`, "Restaurar"))) return;
    st.textContent = "Restaurando…";
    try {
      const ahora = new Date().toISOString();
      for (const [tabla, filas] of [["contratos", cs], ["precios", ps]]) {
        for (let i = 0; i < filas.length; i += 500) {
          const { error } = await sb.from(tabla).upsert(filas.slice(i, i + 500).map(x => ({ id: x.id, data: clean(x), updated_at: ahora })));
          if (error) throw errSb(error);
        }
      }
      st.textContent = "Listo: datos restaurados.";
    } catch (err) { st.textContent = "No se pudo restaurar: " + (err.message || err.code); }
  };
}

  $("nav.tabs").hidden = true; $("#btnNuevo").hidden = true; $("#btnRespaldo").hidden = true; $("#btnSalir").hidden = true;
  const nueva = modo === "nueva";
  $("#view").innerHTML = `<div class="panel" style="max-width:420px;margin:40px auto">
    <h1 style="font-size:24px">${nueva ? "Elegí una contraseña nueva" : "Ingresar"}</h1>
    <p class="muted" style="margin-top:0">${nueva ? "Vas a usarla para entrar de ahora en más." : "Usá el mail y la contraseña que te asignaron."}</p>
    <div class="grid" style="grid-template-columns:1fr">
      ${nueva ? "" : '<label class="fld">Mail<input type="text" id="lMail" autocomplete="username" inputmode="email"></label>'}
      <label class="fld">Contraseña<input type="password" id="lPass" autocomplete="${nueva ? "new-password" : "current-password"}"></label>
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap">
      <button class="btn primary" id="lEntrar">${nueva ? "Guardar contraseña" : "Entrar"}</button>
      ${nueva ? "" : '<button class="btn" id="lOlvido">Olvidé mi contraseña</button>'}
    </div>
    <div class="status" id="lStatus"></div>
  </div>`;
  const st = $("#lStatus");
  const go = async () => {
    const pass = $("#lPass").value;
    if (nueva) {
      if (pass.length < 8) { st.textContent = "Usá al menos 8 caracteres."; return; }
      const { error } = await sb.auth.updateUser({ password: pass });
      if (error) { st.textContent = "No se pudo guardar: " + error.message; return; }
      location.hash = "panel"; location.reload(); return;
    }
    const email = $("#lMail").value.trim();
    if (!email || !pass) { st.textContent = "Completá mail y contraseña."; return; }
    st.textContent = "Ingresando…";
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) { st.textContent = "Mail o contraseña incorrectos."; return; }
    location.reload();
  };
  $("#lEntrar").onclick = go;
  $("#lPass").onkeydown = e => { if (e.key === "Enter") go(); };
  const olv = $("#lOlvido");
  if (olv) olv.onclick = async () => {
    const email = $("#lMail").value.trim();
    if (!email) { st.textContent = "Escribí tu mail y volvé a tocar «Olvidé mi contraseña»."; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/" });
    st.textContent = error ? "No se pudo enviar el mail: " + error.message : "Te enviamos un mail con un enlace para elegir una contraseña nueva.";
  };
}

/* Arranque */
$("#btnNuevo").onclick = () => abrirNuevo();
$("#btnRespaldo").onclick = () => abrirRespaldo();
$("#btnSalir").onclick = async () => { await sb.auth.signOut(); location.hash = ""; location.reload(); };
(async () => {
  try {
    const cfg = await fetch("/api/config").then(r => { if (!r.ok) throw new Error(); return r.json(); });
    if (!cfg.url || !cfg.anon) throw new Error();
    sb = window.supabase.createClient(cfg.url, cfg.anon);
  } catch {
    $("#view").innerHTML = '<div class="notice err">Falta la configuración del servidor (SUPABASE_URL y SUPABASE_ANON_KEY en Netlify).</div>';
    return;
  }
  let recuperando = /type=(recovery|invite)/.test(location.hash);
  sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { recuperando = true; pantallaLogin("nueva"); } });
  const { data: { session } } = await sb.auth.getSession();
  if (recuperando && session) return pantallaLogin("nueva");
  if (!session) return pantallaLogin();
  if (!VISTAS.includes(location.hash.slice(1))) history.replaceState(null, "", "#panel");
  $("nav.tabs").hidden = false; $("#btnRespaldo").hidden = false; $("#btnSalir").hidden = false; $("#btnNuevo").hidden = false;
  RUNTIME.db = crearDb(); RUNTIME.sample = claudeApi; RUNTIME.assets = archivosApi; RUNTIME.downloads = descargasApi;
  S.sample = claudeApi; S.assets = archivosApi; S.downloads = descargasApi;
  render();
  Store.init().catch(e => { S.error = "No se pudieron leer los datos: " + (e.message || e.code); render(); });
})();
</script>
</body>
</html>
